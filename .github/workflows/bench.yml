name: Benchmark
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node benchmark/algorithms.js
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark/
        if: always()
