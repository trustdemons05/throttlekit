name: CI

on:
  push:
    branches: [master, main]
    tags:
      - 'v*.*'
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --reporter=verbose

      - name: Build
        run: npm run build

      - name: Verify CJS import
        run: node -e "const m = require('./dist/index.cjs'); console.log(typeof m.rateLimit);"

      - name: Verify ESM import
        run: node --input-type=module -e "import('./dist/index.js').then(m => console.log(typeof m.rateLimit));"

      - name: Verify subpath exports
        run: |
          node -e "const express = require('throttlekit/express'); console.log(typeof express.throttleExpress);"
          node -e "const fetch = require('throttlekit/fetch'); console.log(typeof fetch.throttleFetch);"
          node -e "const redis = require('throttlekit/redis'); console.log(typeof redis.RedisStore);"
